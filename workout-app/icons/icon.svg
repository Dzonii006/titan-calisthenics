<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App theme dark charcoal background -->
  <rect width="512" height="512" rx="112" fill="#121214"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#222226" stroke-width="8"/>
  
  <!-- Subtle outer decorative boundary -->
  <circle cx="256" cy="270" r="190" fill="none" stroke="#1f1f23" stroke-width="6"/>

  <!-- Calisthenics Rings Silhouette -->
  <g stroke="#ffffff" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Straps -->
    <path d="M190 40 L190 200" stroke="#71717a" stroke-width="16"/>
    <path d="M322 40 L322 200" stroke="#71717a" stroke-width="16"/>
    <!-- Left Ring -->
    <circle cx="190" cy="290" r="78"/>
    <!-- Right Ring -->
    <circle cx="322" cy="290" r="78"/>
  </g>
</svg>
